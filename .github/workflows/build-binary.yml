name: Build

on:
  workflow_dispatch:  # Manual triggers only

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        # Linux x86-64 gnu
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-26.04
          artifactname: linux-gnu-x86_64
        # Linux AArch64 gnu
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-24.04-arm
          artifactname: linux-gnu-aarch64
        # Linux AArch64 musl
        - target: aarch64-unknown-linux-musl
          os: ubuntu-24.04-arm
          artifactname: linux-musl-aarch64
        # Windows x86-64
        - target: x86_64-pc-windows-gnu
          os: ubuntu-26.04
          artifactname: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Environment variables
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable
        target: ${{ matrix.target }}
        cache-key: ${{ matrix.target }}
        cache-workspaces: "whirl -> target"

    - name: Install musl tools (linux-musl only)
      if: contains(matrix.target, 'linux-musl')
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> $GITHUB_ENV
        echo "RUSTFLAGS=-C target-feature=-crt-static -C link-arg=-lm $RUSTFLAGS" >> $GITHUB_ENV

    - name: Install MinGW-w64 (windows-gnu only)
      if: contains(matrix.target, 'windows-gnu')
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64
        echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV

    - name: Build
      working-directory: whirl
      run: CARGO_PROFILE_RELEASE_STRIP=symbols CARGO_PROFILE_RELEASE_LTO=fat cargo build --release --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: whirl-${{ env.SHORT_SHA }}-${{ matrix.artifactname }}
        path: whirl/target/${{ matrix.target }}/release/${{ contains(matrix.target, 'windows') && 'whirl.exe' || 'whirl' }}
