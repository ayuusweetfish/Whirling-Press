[package]
name = "whirl"
version = "0.1.0"
edition = "2024"

[dependencies]
serde-saphyr = "1.2.0"
serde = { version = "1.0", features = ["derive"] }

walkdir = "2.5.0"

typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-kit = { version = "0.15", features = ["scan-fonts"] }
typst-render = "0.15"

lopdf = "0.45"
png = "0.18"

argh = "0.1"

fluent = "0.17"
fluent-langneg = "0.14"
sys-locale = "0.3.2"

egui = { version = "0.36", default-features = false, features = [], optional = true }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "wayland", "web_screen_reader", "wgpu", "x11"], optional = true }
rfd = { version = "0.17", optional = true }
notify = { version = "9.0.0-rc.5", optional = true }
opener = { version = "0.8.5", features = ["reveal"], optional = true }

[features]
gui = ["dep:egui", "dep:eframe", "dep:rfd", "dep:notify", "dep:opener"]
default = ["gui"]

[profile.release]
# lto = true
# codegen-units = 1
panic = "abort"
