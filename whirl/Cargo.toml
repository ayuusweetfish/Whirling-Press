[package]
name = "whirl"
version = "0.1.0"
edition = "2024"

[dependencies]
serde-saphyr = "1.2.0"
serde = { version = "1.0", features = ["derive"] }

typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-kit = { version = "0.15", features = ["scan-fonts"] }
typst-render = "0.15"

lopdf = "0.44"

argh = "0.1"

egui = { version = "0.36", default-features = false, features = [], optional = true }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "wayland", "web_screen_reader", "wgpu", "x11"], optional = true }
rfd = { version = "0.17", optional = true }

[features]
gui = ["dep:egui", "dep:eframe", "dep:rfd"]
default = ["gui"]

[profile.release]
# lto = true
# codegen-units = 1
panic = "abort"
